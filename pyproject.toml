[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gugabobo"
version = "0.1.0"
description = "Cloud-first autonomous agent prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram[proxy]>=3.30,<4",
  "fastapi>=0.111",
  "httpx[socks]>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
gugabobo = "gugabobo.adapters.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
