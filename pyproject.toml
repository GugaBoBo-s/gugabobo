[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gugabobo"
version = "0.1.0"
description = "Cloud-first autonomous agent prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "glitter-cli>=0.6.12,<0.7",
  "httpx[socks]>=0.28",
  "litellm>=1.95,<2.0",
  "pydantic>=2.7",
  "pydantic-ai-slim>=2.22,<3",
  "pydantic-ai-litellm>=0.2.8,<0.3",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
  "vexor>=0.26,<0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
gugabobo = "gugabobo.adapters.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
